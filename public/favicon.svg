<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Glowing Game Controller Icon -->
  <g filter="url(#glow)">
    <!-- Controller Base -->
    <path d="M150 160 C120 160 90 190 80 230 C70 270 60 350 95 380 C115 397 145 390 165 350 L195 290 L317 290 L347 350 C367 390 397 397 417 380 C452 350 442 270 432 230 C422 190 392 160 362 160 Z" fill="url(#iconGrad)"/>
    
    <!-- D-Pad Left -->
    <rect x="135" y="215" width="18" height="50" rx="4" fill="#ffffff"/>
    <rect x="119" y="231" width="50" height="18" rx="4" fill="#ffffff"/>

    <!-- Action Buttons Right (PS Symbols) -->
    <circle cx="365" cy="215" r="10" fill="#ffffff"/>
    <rect x="355" y="250" width="20" height="20" rx="3" fill="#ffffff"/>
    <path d="M 335 240 L 345 220 L 355 240 Z" fill="#ffffff"/>

    <!-- Center Console PS Light Ring -->
    <circle cx="256" cy="225" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="256" cy="225" r="8" fill="#38bdf8"/>
  </g>
</svg>